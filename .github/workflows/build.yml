name: Build

on:
  push:
    branches: [main, claude-notch]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Als Download-Version (Release) veröffentlichen"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Swift Version
        run: swift --version

      - name: Skripte prüfen
        run: for f in scripts/*.sh; do bash -n "$f"; done

      - name: App bauen (Universal)
        env:
          ARCHS: "arm64 x86_64"
          VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || (inputs.release && format('0.1.{0}', github.run_number)) || '0.1.0-dev' }}
        run: |
          VERSION="${VERSION#v}" ./scripts/build-app.sh
          lipo -info "dist/Claude Notch.app/Contents/MacOS/ClaudeNotch"
          codesign --verify --verbose "dist/Claude Notch.app"

      - name: Zip
        run: |
          cd dist
          ditto -c -k --keepParent "Claude Notch.app" ClaudeNotch.zip
          shasum -a 256 ClaudeNotch.zip | tee ClaudeNotch.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: ClaudeNotch
          path: |
            dist/ClaudeNotch.zip
            dist/ClaudeNotch.zip.sha256

      - name: Release veröffentlichen
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v0.1.${GITHUB_RUN_NUMBER}"
          fi
          gh release create "$TAG" dist/ClaudeNotch.zip dist/ClaudeNotch.zip.sha256 \
            --target "$GITHUB_SHA" --generate-notes --title "Claude Notch $TAG"
